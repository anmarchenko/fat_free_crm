# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: Rspec

on:
  pull_request:
    branches: [ master ]

jobs:
  dd_plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.dd_plan.outputs.matrix }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4' # 4.0 temporarily commented out
        bundler-cache: true

    - name: Configure Datadog Test Optimization
      uses: datadog/test-visibility-github-action@v3
      with:
        languages: ruby
        api_key: ${{ secrets.DD_API_KEY }}
        site: datadoghq.com
    - name: Install ddtest
      run: |
        mkdir -p bin
        curl -fsSL https://github.com/DataDog/ddtest/releases/latest/download/ddtest-linux-amd64 -o bin/ddtest
        chmod +x bin/ddtest
    - name: Prepare DB
      run: DB=sqlite RAILS_ENV=test bundle exec rake spec:preparedb
    - name: Plan test execution
      id: dd_plan
      run: |
        rm -rf .testoptimization
        bin/ddtest plan 'spec/{models,controllers,views,helpers,routing,mailers,lib,features}/**/*_spec.rb' --platform ruby --framework rspec --min-parallelism 1 --max-parallelism 4
    - uses: actions/upload-artifact@v4
      with:
        name: ddtest-plan
        path: .testoptimization/
        include-hidden-files: true
        if-no-files-found: error

  test:
    needs: dd_plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.dd_plan.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4' # 4.0 temporarily commented out
        bundler-cache: true

    - name: Configure Datadog Test Optimization
      uses: datadog/test-visibility-github-action@v3
      with:
        languages: ruby
        api_key: ${{ secrets.DD_API_KEY }}
        site: datadoghq.com
    - name: Install ddtest
      run: |
        mkdir -p bin
        curl -fsSL https://github.com/DataDog/ddtest/releases/latest/download/ddtest-linux-amd64 -o bin/ddtest
        chmod +x bin/ddtest
    - name: Prepare DB
      run: DB=sqlite RAILS_ENV=test bundle exec rake spec:preparedb
    - uses: actions/download-artifact@v4
      with:
        name: ddtest-plan
        path: .testoptimization/
    - name: Run tests
      run: |
        test -f .testoptimization/manifest.txt
        bin/ddtest run --platform ruby --framework rspec --ci-node ${{ matrix.ci_node_index }}
